api_version: 1
id: interface.admin
version: 0.1.0
kind: interface
name: 管理工具
description: 暴露状态/插件/Trace 给 LLM 的管理工具
provides:
  - interface.admin
requires:
  - kernel.tools
tools:
  - name: admin_status
    summary: 查看运行时健康、插件与 Trace 概况
    permissions: [admin]
  - name: admin_plugins
    summary: 列出插件状态
    permissions: [admin]
  - name: admin_traces
    summary: 查看最近回合 Trace
    permissions: [admin]
  - name: read_manual
    summary: 读取插件或工具手册
    permissions: [admin]
manual: MANUAL.md
